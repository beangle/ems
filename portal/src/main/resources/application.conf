caffeine.jcache {
  # 兜底：映射里声明过、但这里没单独配置的区域（实体类全名、查询/时间戳区域等），
  # 由 beangle-data 的区域工厂 CaffeineRegionFactory 按本块的配置现建缓存，
  # 容量、lazy-expiration、eager-expiration 都会生效（见 beangle/data 的 docs/jcache.md）。
  default {
    policy {
      maximum {
        size = 10000
      }
      lazy-expiration {
        creation = 5m
        update = 5m
        access = 5m
      }
      eager-expiration {
        after-write = 5m
      }
    }
  }

  default-update-timestamps-region{
    policy{
      maximum{
        size = 10000
      }
      lazy-expiration {
        creation = 5m
        update = 5m
        access = 5m
      }
    }
  }

  default-query-results-region{
    policy{
      maximum{
        size = 10000
      }
      lazy-expiration {
        creation = 5m
        update = 5m
        access = 5m
      }
    }
  }

  ems{
    policy{
      maximum{
        size = 10000
      }
      lazy-expiration {
        creation = 5m
        update = 5m
        access = 5m
      }
    }
  }
}

logging {
  level {
    org.hibernate.orm.connections.pooling = ERROR
  }
}
